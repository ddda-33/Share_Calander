<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>수행평가 & 학교 일정 공지 게시판</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
:root{--bg:#f2f5f7;--card:#fff;--tx:#14202e;--mut:#5d6b7a;--ac:#4a90e2;--bd:#d9e5ec;--el:#eef6ff;--danger:#e74c3c;--success:#2ecc71;--badge-eval:#ff7675;--badge-sched:#74b9ff;color-scheme:light;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171e;--card:#18222c;--tx:#e8eef3;--mut:#93a1af;--ac:#69b9e8;--bd:#2c3a47;--el:#1c2d3d;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.55 "IBM Plex Sans KR",system-ui,sans-serif}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:24px;margin:6px 0 2px;text-align:center}
h2{font-size:18px;margin:0 0 12px}
.mut{color:var(--mut);margin:2px 0 12px;font-size:13px;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.04)}
label{display:block;margin:12px 0 4px;font-weight:600;font-size:14px}
select,input,textarea{display:block;width:100%;padding:10px;font:inherit;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
button{font:inherit;font-weight:600;padding:10px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer;transition:all 0.2s}
button:hover{background:var(--el)}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.pri:hover{opacity:0.9}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;padding:3px 8px;border-radius:12px;font-size:11px;font-weight:bold;color:#fff}
.badge.eval{background:var(--badge-eval)}
.badge.sched{background:var(--badge-sched)}
.badge.other{background:#8e7cc3}
.file-note{font-size:12px;color:var(--mut);margin-top:5px}
.notice-banner{display:none;background:var(--el);border:1px solid var(--ac);border-radius:10px;padding:12px;margin-bottom:14px}
.notice-banner.show{display:block}
.event-attachment{display:inline-flex;gap:6px;align-items:center;margin-top:10px}
@media(max-width:650px){
  body{font-size:14px; -webkit-text-size-adjust:100%}
  main{width:100%;padding:8px}
  h1{font-size:20px;line-height:1.35}
  h2{font-size:17px}
  .mut{font-size:12px}
  .card{padding:12px;margin-bottom:10px;border-radius:10px}
  .top-bar{align-items:stretch;flex-direction:column;gap:8px;padding:10px;margin-bottom:10px}
  .top-bar .row{width:100%;gap:6px}
  .top-bar button{flex:1;min-width:0;padding:9px 6px;font-size:13px}
  button{padding:9px 11px;font-size:14px}
  input,select,textarea{font-size:16px;min-width:0}
  .cal-controls{gap:6px;margin-bottom:10px;flex-wrap:wrap}
  .cal-controls .month-title{font-size:17px}
  .cal-cell{min-width:0;min-height:70px;padding:3px 2px}
  .cal-day-header{padding:6px 1px;font-size:10px}
  .cal-date{font-size:11px}
  .event-item{font-size:9px;line-height:1.25;padding:2px;margin-bottom:2px;border-left-width:2px}
  .modal-overlay{padding:8px;align-items:flex-end}
  .modal-body{width:100%;max-width:none;max-height:92dvh;padding:16px;border-radius:14px 14px 8px 8px;overflow-y:auto}
  .row{gap:6px}
}
@media(max-width:380px){
  .cal-cell{min-height:62px}
  .event-item{font-size:8px}
  .top-bar button{font-size:12px}
}

.top-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:16px}
.user-info{font-weight:600;font-size:14px}

.cal-controls{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.cal-controls .month-title{font-size:20px;font-weight:bold}
.cal-grid{display:grid;grid-template-columns:repeat(7, 1fr);gap:1px;background:var(--bd);border:1px solid var(--bd);border-radius:8px;overflow:hidden}
.cal-day-header{background:var(--bg);padding:10px;text-align:center;font-weight:bold;font-size:13px;color:var(--mut)}
.cal-day-header.sun{color:#e74c3c}
.cal-day-header.sat{color:#3498db}
.cal-cell{background:var(--card);min-height:100px;padding:6px;position:relative;vertical-align:top}
.cal-cell.other-month{background:var(--bg);opacity:0.5}
.cal-date{font-size:12px;font-weight:bold;margin-bottom:4px}
.cal-cell.sun .cal-date{color:#e74c3c}
.cal-cell.sat .cal-date{color:#3498db}
.cal-cell.today{background:var(--el)}
.event-item{font-size:11px;padding:3px 6px;border-radius:4px;margin-bottom:4px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--bg);border-left:3px solid var(--ac)}
.event-item.eval{border-left-color:var(--badge-eval)}
.event-item.sched{border-left-color:var(--badge-sched)}

.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000;padding:16px}
.modal-overlay.active{display:flex}
.modal-body{background:var(--card);padding:24px;border-radius:12px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.15)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>수행평가 & 학교 일정 공지</h1>
  <p class="mut">반 시간표 코드를 연동하여 학급 수행평가와 일정을 실시간으로 공유해요.</p>

  <!-- [1] 코드 및 사용자 설정 로그인 화면 -->
  <section id="secLogin" class="card">
    <h2>1. 학급 입장하기</h2>
    <label>시간표 코드 입력
      <textarea id="inClassCode" rows="3" placeholder="시간표 웹사이트에서 회장이 공유한 코드를 붙여넣으세요"></textarea>
    </label>
    <button id="btnLoadCode" class="pri" style="margin-top:10px;width:100%;">코드 확인하기</button>

    <div id="userProfileForm" hidden style="margin-top:20px;border-top:1px solid var(--bd);padding-top:16px;">
      <h2>2. 내 정보 입력</h2>
      <label>이름<input id="userName" placeholder="이름을 입력하세요"></label>
      <label>반 선택<select id="userClassSelect"></select></label>
      <div id="userElectivesArea"></div>
      <button id="btnSaveProfile" class="pri" style="margin-top:16px;width:100%;">입장 및 정보 저장</button>
    </div>
  </section>

  <!-- [2] 메인 수행평가 캘린더 화면 -->
  <section id="secMain" hidden>
    <div class="top-bar">
      <div class="user-info" id="displayUserInfo">학급 정보 불러오는 중...</div>
      <div class="row">
        <button id="btnOpenAddModal" class="pri">+ 등록</button>
        <button id="btnMyProfile">내 정보</button>
        <button id="btnNotify">알림 켜기</button>
        <button id="btnLogout">다른 코드로 변경</button>
      </div>
    </div>

    <div id="noticeBanner" class="notice-banner" role="status"></div>
    <div class="card">
      <div class="cal-controls">
        <button id="btnPrevMonth">&lt; 이전달</button>
        <div class="row">
          <select id="selectYear" style="width:100px;padding:6px;"></select>
          <select id="selectMonth" style="width:80px;padding:6px;"></select>
        </div>
        <button id="btnNextMonth">다음달 &gt;</button>
      </div>

      <div class="cal-grid" id="calendarGrid">
        <!-- 동적 생성 -->
      </div>
    </div>

    <div class="card">
      <h2>다가오는 일정</h2>
      <div id="eventListArea">등록된 일정이 없습니다.</div>
    </div>
  </section>
</main>

<div class="modal-overlay" id="modalAdd">
  <div class="modal-body">
    <h2 id="addModalTitle">등록</h2>
    <label>구분
      <select id="addType">
        <option value="eval">수행평가</option>
        <option value="sched">학교 일정</option>
        <option value="other">기타</option>
      </select>
    </label>
    <label>날짜<input type="date" id="addDate"></label>
    <label>과목 / 일정명<input id="addTitle" placeholder="예: 국어 수행평가, 중간고사"></label>
    <label id="addSubjectLabel">관련 과목 / 선택과목 묶음
      <select id="addSubjectSelect"></select>
    </label>
    <label>상세 내용
      <textarea id="addDesc" rows="4" placeholder="수행평가 범위, 준비물, 제출 방법 등을 적어주세요"></textarea>
    </label>
    <label>안내문 / 첨부파일<input id="addAttachment" type="file" accept="image/*,.pdf,.doc,.docx,.ppt,.pptx" /></label>
    <p class="file-note">사진 또는 PDF·문서 파일, 최대 10MB까지 첨부할 수 있습니다.</p>
    <label style="display:flex;gap:8px;align-items:center;font-weight:400"><input id="removeAttachment" type="checkbox" style="width:auto"> 기존 첨부파일 삭제</label>
    <div class="row" style="margin-top:16px;justify-content:flex-end;">
      <button id="btnAddSave" class="pri">등록하기</button>
      <button id="btnAddClose">취소</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalDetail">
  <div class="modal-body">
    <h2 id="detailTitle">상세 정보</h2>
    <p id="detailMeta" class="mut" style="text-align:left;"></p>
    <p id="detailDesc" style="white-space:pre-wrap;margin:16px 0;background:var(--bg);padding:12px;border-radius:8px;"></p>
    <div id="detailAttachment"></div>
    <div class="row" style="justify-content:flex-end;">
      <button id="btnEditEvent" hidden>수정</button>
      <button id="btnDeleteEvent" hidden style="color:var(--danger);border-color:var(--danger);">삭제</button>
      <button id="btnDetailClose">닫기</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalProfile">
  <div class="modal-body">
    <h2>내 정보 확인 및 수정</h2>
    <label>이름<input id="profileName"></label>
    <label>반<select id="profileClass"></select></label>
    <div id="profileElectives"></div>
    <div class="row" style="margin-top:16px;justify-content:flex-end;">
      <button id="btnProfileSave" class="pri">저장</button>
      <button id="btnProfileClose">닫기</button>
    </div>
    <p class="file-note">이 정보는 현재 기기의 브라우저에 저장됩니다.</p>
  </div>
</div>


<script>
// 1) Supabase 프로젝트 설정값을 입력하세요. 아래 두 값은 Supabase > Project Settings > API에서 확인합니다.
const SUPABASE_URL = 'https://jsmsgiytjfvfemplmkjx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_oZLS3gNr8zfaGlkyM_5jTQ_iR4CLWqA';
const supabaseReady = !!(window.supabase && SUPABASE_URL.startsWith('https://') && !SUPABASE_URL.includes('YOUR_') && !SUPABASE_ANON_KEY.includes('YOUR_'));
const db = supabaseReady ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const fromB64=str=>Uint8Array.from(atob(str),c=>c.charCodeAt(0));
async function decodeCode(raw){
  const value=raw.trim();
  if(value.startsWith('z:')){
    if(!('DecompressionStream' in window))throw new Error('압축 해제 미지원');
    const stream=new Blob([fromB64(value.slice(2))]).stream().pipeThrough(new DecompressionStream('gzip'));
    return JSON.parse(new TextDecoder().decode(await new Response(stream).arrayBuffer()));
  }
  if(value.startsWith('j:'))return JSON.parse(new TextDecoder().decode(fromB64(value.slice(2))));
  return JSON.parse(decodeURIComponent(escape(atob(value))));
}

function splitItems(text){
  const out=[]; let part='', depth=0;
  for(const ch of text){
    if(ch==='('||ch==='（')depth++;
    if(ch===')'||ch==='）')depth=Math.max(0,depth-1);
    if((ch===','||ch==='，')&&depth===0){if(part.trim())out.push(part.trim());part='';}
    else part+=ch;
  }
  if(part.trim())out.push(part.trim());
  return out;
}
function parseCourse(raw){
  const m=String(raw).trim().match(/^(.*?)\s*[（(]\s*(.*?)\s*[）)]\s*$/);
  if(!m)return {name:String(raw).trim()};
  return {name:m[1].trim()};
}

let classData = null;
let rawCode = '';
let userProfile = null;
let currentYear = new Date().getFullYear();
let currentMonth = new Date().getMonth();
let selectedEventId = null;

function getStorageKey(key){ return 'eval-board-' + (classKey || 'default') + '-' + key; }
let classKey = '';
let eventsCache = [];
let realtimeChannel = null;
let editingEventId = null;
let currentUserId = null;
let notificationReady = false;
let lastNoticeIds = new Set();
const MAX_ATTACHMENT_BYTES = 10 * 1024 * 1024;
async function makeClassKey(code){
  const bytes = new TextEncoder().encode(code.trim());
  const digest = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(digest)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function ensureClassMembership(){
  if(!db) throw new Error('Supabase 설정이 필요합니다.');
  let {data:{user}}=await db.auth.getUser();
  if(!user){
    const {data,error}=await db.auth.signInAnonymously();
    if(error) throw new Error('학생 익명 로그인을 사용할 수 없습니다. Supabase에서 Anonymous Sign-ins를 활성화하세요.');
    user=data.user;
  }
  currentUserId=user?.id||null;
  const {error}=await db.rpc('join_class',{p_class_key:classKey});
  if(error) throw new Error('학급 공유 공간에 입장하지 못했습니다: '+error.message);
}
function loadEvents(){ return eventsCache; }
async function refreshEvents(){
  if(!db || !classKey) return;
  const {data,error}=await db.from('class_events').select('*').eq('class_key',classKey).order('date',{ascending:true});
  if(error){ console.error(error); alert('공유 일정을 불러오지 못했습니다: '+error.message); return; }
  eventsCache=data||[];
  renderCalendar(); renderUpcomingList();
  checkUpcomingEvaluations();
}
function subscribeEvents(){
  if(!db || !classKey) return;
  if(realtimeChannel) db.removeChannel(realtimeChannel);
  realtimeChannel=db.channel('class-events-'+classKey)
    .on('postgres_changes',{event:'*',schema:'public',table:'class_events',filter:'class_key=eq.'+classKey},()=>refreshEvents())
    .subscribe();
}
function typeLabel(type){ return type==='eval'?'수행평가':(type==='sched'?'학교 일정':'기타'); }
function canManageEvent(ev){ return !!ev; }
function eventMatchesMyCourses(ev){
  if(ev.type!=='eval' || !ev.subject || !ev.subject_group) return false;
  if(!userProfile || !userProfile.electives) return false;
  return userProfile.electives[ev.subject_group] === ev.subject;
}
function showNotices(events){
  const messages=events.map(ev=>`• ${ev.title} (${ev.date})${ev.subject?' · '+ev.subject:''}`);
  const banner=$('#noticeBanner'); banner.textContent='내 선택과목 수행평가가 다가와요\n'+messages.join('\n'); banner.style.whiteSpace='pre-line'; banner.classList.add('show');
  if(notificationReady && 'Notification' in window && Notification.permission==='granted'){
    events.forEach(ev=>{
      const options={body:`${ev.title} · ${ev.date}`,tag:'eval-'+ev.id};
      if('serviceWorker' in navigator) navigator.serviceWorker.ready.then(reg=>reg.showNotification('학교 알림 캘린더',options)).catch(()=>{try{new Notification('학교 알림 캘린더',options);}catch(e){}});
      else {try{new Notification('학교 알림 캘린더',options);}catch(e){}}
    });
  }
}
function checkUpcomingEvaluations(){
  if(!userProfile) return;
  const today=new Date(); today.setHours(0,0,0,0);
  const horizon=new Date(today); horizon.setDate(horizon.getDate()+3);
  const candidates=eventsCache.filter(ev=>{
    if(!eventMatchesMyCourses(ev)) return false;
    const d=new Date(ev.date+'T00:00:00');
    return d>=today && d<=horizon;
  });
  const unseen=candidates.filter(ev=>!lastNoticeIds.has(String(ev.id)));
  if(unseen.length){
    unseen.forEach(ev=>lastNoticeIds.add(String(ev.id)));
    try{localStorage.setItem(getStorageKey('noticed'),JSON.stringify([...lastNoticeIds]));}catch(e){}
    showNotices(unseen);
  }
}
async function enableNotifications(){
  if(!('Notification' in window)){alert('이 브라우저는 알림 기능을 지원하지 않습니다.');return;}
  const permission=await Notification.requestPermission();
  notificationReady=permission==='granted';
  $('#btnNotify').textContent=notificationReady?'알림 켜짐':'알림 켜기';
  if(notificationReady){alert('알림을 허용했어요. 앱을 열어 둔 동안 내 선택과목 수행평가 알림을 받을 수 있습니다.');checkUpcomingEvaluations();}
  else alert('브라우저 설정에서 알림 권한을 허용해 주세요.');
}
function buildElectiveControls(container, selected={}){
  const groups={};
  (classData.groupText||'').split('\n').forEach(line=>{const i=line.search(/[:：]/);if(i<1)return;const name=line.slice(0,i).trim();groups[name]=splitItems(line.slice(i+1)).map(parseCourse).filter(x=>x.name);});
  container.innerHTML='';
  for(const [gName,items] of Object.entries(groups)){
    const label=document.createElement('label'); label.textContent=gName+' 선택과목';
    const select=document.createElement('select'); select.className='profile-elective'; select.dataset.group=gName;
    select.innerHTML='<option value="">선택 안함</option>'+items.map(it=>`<option value="${esc(it.name)}">${esc(it.name)}</option>`).join('');
    select.value=selected[gName]||''; label.appendChild(select); container.appendChild(label);
  }
  if(!Object.keys(groups).length) container.innerHTML='<p class="mut">등록된 선택과목 묶음이 없습니다.</p>';
}
function buildEventSubjectOptions(selectedGroup='', selectedSubject=''){
  const options=['<option value="">공통 / 해당 없음</option>'];
  (classData.groupText||'').split('\n').forEach(line=>{
    const i=line.search(/[:：]/);if(i<1)return;
    const group=line.slice(0,i).trim();
    splitItems(line.slice(i+1)).map(parseCourse).filter(x=>x.name).forEach(course=>{
      const value=JSON.stringify({group,subject:course.name});
      options.push(`<option value="${esc(value)}">${esc(group)} — ${esc(course.name)}</option>`);
    });
  });
  $('#addSubjectSelect').innerHTML=options.join('');
  const selected=selectedGroup && selectedSubject ? JSON.stringify({group:selectedGroup,subject:selectedSubject}) : '';
  $('#addSubjectSelect').value=selected;
}

function openProfile(){
  $('#profileName').value=userProfile.name||'';
  $('#profileClass').innerHTML=(classData.classes||[]).map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
  $('#profileClass').value=userProfile.cls||'';
  buildElectiveControls($('#profileElectives'),userProfile.electives||{});
  $('#modalProfile').classList.add('active');
}

$('#btnLoadCode').onclick=async()=>{
  const code=$('#inClassCode').value.trim();
  if(!code){ alert('시간표 코드를 입력하세요.'); return; }
  try{
    const o=await decodeCode(code);
    if(!o.classes||!o.tt)throw 0;
    classData=o;
    rawCode=code;
    if(!supabaseReady) throw new Error('Supabase設定が必要です');
    classKey=await makeClassKey(code);
    await ensureClassMembership();
    $('#userClassSelect').innerHTML=classData.classes.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('');
    
    buildElectiveControls($('#userElectivesArea'),{});
    $('#userProfileForm').hidden=false;

  }catch(e){
    alert(e.message==='Supabase設定が必要です' ? '먼저 코드 상단의 Supabase URL과 anon key를 설정해야 합니다.' : '코드가 틀렸거나 시간표 정보를 읽을 수 없습니다.');
  }
};

$('#btnSaveProfile').onclick=()=>{
  const name=$('#userName').value.trim();
  const cls=$('#userClassSelect').value;
  if(!name){ alert('이름을 입력하세요.'); return; }

  const electives={};
  document.querySelectorAll('#userElectivesArea .profile-elective').forEach(sel=>{
    electives[sel.dataset.group]=sel.value;
  });

  userProfile={ name, cls, electives };
  try{
    localStorage.setItem(getStorageKey('profile'), JSON.stringify(userProfile));
    localStorage.setItem('eval-board-code', rawCode);
  }catch(e){}

  initMainView();
};

function initMainView(){
  $('#secLogin').hidden=true;
  $('#secMain').hidden=false;

  const titlePrefix = (classData.grade?classData.grade+' ':'') + (classData.semester?classData.semester+' ':'');
  $('#displayUserInfo').innerHTML = `${esc(titlePrefix)} <strong>${esc(userProfile.cls)}</strong> - ${esc(userProfile.name)} 학생`;

  let yHtml='';
  for(let y=2025;y<=2030;y++) yHtml+=`<option value="${y}" ${y===currentYear?'selected':''}>${y}년</option>`;
  $('#selectYear').innerHTML=yHtml;

  let mHtml='';
  for(let m=0;m<12;m++) mHtml+=`<option value="${m}" ${m===currentMonth?'selected':''}>${m+1}월</option>`;
  $('#selectMonth').innerHTML=mHtml;

  renderCalendar();
  renderUpcomingList();
  try{lastNoticeIds=new Set(JSON.parse(localStorage.getItem(getStorageKey('noticed'))||'[]').map(String));}catch(e){lastNoticeIds=new Set();}
  notificationReady=('Notification' in window && Notification.permission==='granted');
  $('#btnNotify').textContent=notificationReady?'알림 켜짐':'알림 켜기';
  refreshEvents();
  subscribeEvents();
}

function renderCalendar(){
  const grid=$('#calendarGrid');
  grid.innerHTML='';

  const days=['일','월','화','수','목','금','토'];
  days.forEach((d,i)=>{
    const dh=document.createElement('div');
    dh.className='cal-day-header' + (i===0?' sun':(i===6?' sat':''));
    dh.textContent=d;
    grid.appendChild(dh);
  });

  const firstDay = new Date(currentYear, currentMonth, 1).getDay();
  const lastDate = new Date(currentYear, currentMonth + 1, 0).getDate();
  const prevLastDate = new Date(currentYear, currentMonth, 0).getDate();

  const events = loadEvents();
  const today = new Date();

  for(let i=firstDay-1; i>=0; i--){
    const cell=document.createElement('div');
    cell.className='cal-cell other-month';
    cell.innerHTML=`<div class="cal-date">${prevLastDate - i}</div>`;
    grid.appendChild(cell);
  }

  for(let d=1; d<=lastDate; d++){
    const cell=document.createElement('div');
    const isSun = new Date(currentYear, currentMonth, d).getDay() === 0;
    const isSat = new Date(currentYear, currentMonth, d).getDay() === 6;
    const isToday = today.getFullYear()===currentYear && today.getMonth()===currentMonth && today.getDate()===d;

    cell.className='cal-cell' + (isSun?' sun':(isSat?' sat':'')) + (isToday?' today':'');
    cell.innerHTML=`<div class="cal-date">${d}</div>`;

    const dateStr = `${currentYear}-${String(currentMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const dayEvents = events.filter(e => e.date === dateStr);

    dayEvents.forEach(ev => {
      const item = document.createElement('div');
      item.className = `event-item ${ev.type}`;
      item.textContent = '['+typeLabel(ev.type)+'] ' + ev.title;
      item.onclick = (e) => { e.stopPropagation(); openDetailModal(ev); };
      cell.appendChild(item);
    });

    grid.appendChild(cell);
  }

  const totalCells = firstDay + lastDate;
  const nextPadding = (7 - (totalCells % 7)) % 7;
  for(let i=1; i<=nextPadding; i++){
    const cell=document.createElement('div');
    cell.className='cal-cell other-month';
    cell.innerHTML=`<div class="cal-date">${i}</div>`;
    grid.appendChild(cell);
  }
}

$('#btnPrevMonth').onclick=()=>{
  currentMonth--;
  if(currentMonth<0){ currentMonth=11; currentYear--; }
  updateSelects(); renderCalendar();
};
$('#btnNextMonth').onclick=()=>{
  currentMonth++;
  if(currentMonth>11){ currentMonth=0; currentYear++; }
  updateSelects(); renderCalendar();
};
$('#selectYear').onchange=e=>{ currentYear=+e.target.value; renderCalendar(); };
$('#selectMonth').onchange=e=>{ currentMonth=+e.target.value; renderCalendar(); };

function updateSelects(){
  $('#selectYear').value = currentYear;
  $('#selectMonth').value = currentMonth;
}

function renderUpcomingList(){
  const events=[...loadEvents()].sort((a,b)=>a.date.localeCompare(b.date));
  const area=$('#eventListArea'); area.innerHTML='';
  if(!events.length){area.innerHTML='<p class="mut">등록된 수행평가나 일정이 없습니다.</p>';return;}
  events.forEach(ev=>{
    const card=document.createElement('div');card.className='card';
    card.style.cssText='margin-bottom:8px;padding:12px;cursor:pointer;background:var(--bg);';
    const row=document.createElement('div');row.className='row';row.style.justifyContent='space-between';
    const left=document.createElement('div');
    const badge=document.createElement('span');badge.className='badge '+ev.type;badge.textContent=typeLabel(ev.type);
    const title=document.createElement('strong');title.style.marginLeft='6px';title.textContent=ev.title;
    left.append(badge,title);
    const date=document.createElement('div');date.style.cssText='font-size:13px;font-weight:bold;color:var(--ac);';date.textContent=ev.date;
    row.append(left,date);card.appendChild(row);
    if(ev.subject){const sub=document.createElement('div');sub.style.cssText='font-size:12px;color:var(--mut);margin-top:4px;';sub.textContent='과목: '+(ev.subject_group?ev.subject_group+' — ':'')+ev.subject;card.appendChild(sub);}
    if(ev.attachment_name){const file=document.createElement('div');file.className='file-note';file.textContent='📎 '+ev.attachment_name;card.appendChild(file);}
    card.addEventListener('click',()=>openDetailModal(ev));area.appendChild(card);
  });
}

$('#btnOpenAddModal').onclick=()=>{
  editingEventId=null; $('#btnAddSave').textContent='등록'; $('#addModalTitle').textContent='등록'; $('#addType').value='eval'; $('#addAttachment').value=''; $('#removeAttachment').checked=false;
  $('#addDate').value = new Date().toISOString().split('T')[0];
  $('#addTitle').value = '';
  $('#addDesc').value = '';

  buildEventSubjectOptions();

  $('#modalAdd').classList.add('active');
};

$('#btnAddClose').onclick=()=> $('#modalAdd').classList.remove('active');

$('#btnAddSave').onclick=async()=>{
  const type=$('#addType').value, date=$('#addDate').value, title=$('#addTitle').value.trim();
  let subject='', subject_group='';
  const selectedSubject=$('#addSubjectSelect').value;
  if(selectedSubject){try{const parsed=JSON.parse(selectedSubject);subject=parsed.subject||'';subject_group=parsed.group||'';}catch(e){}}
  const desc=$('#addDesc').value.trim();
  const file=$('#addAttachment').files[0]||null;
  if(!date||!title){alert('날짜와 제목을 입력하세요.');return;}
  if(!db){alert('Supabase 설정이 필요합니다.');return;}
  if(file && file.size>MAX_ATTACHMENT_BYTES){alert('첨부파일은 10MB 이하만 가능합니다.');return;}
  const payload={class_key:classKey,type,date,title,subject,subject_group,desc};
  let oldEvent=editingEventId?eventsCache.find(e=>String(e.id)===String(editingEventId)):null;
  if(!editingEventId){payload.author=userProfile.name;payload.cls=userProfile.cls;payload.author_id=currentUserId;}
  else {payload.author=oldEvent?.author||userProfile.name;payload.cls=oldEvent?.cls||userProfile.cls;payload.author_id=oldEvent?.author_id||currentUserId;}
  let attachmentPath=oldEvent?.attachment_path||null;
  let attachmentName=oldEvent?.attachment_name||null;
  let attachmentType=oldEvent?.attachment_type||null;
  if($('#removeAttachment').checked){attachmentPath=null;attachmentName=null;attachmentType=null;}
  if(file){
    const safeName=file.name.replace(/[^\w가-힣.\-]/g,'_');
    const path=`${classKey}/${crypto.randomUUID()}-${safeName}`;
    const {error:upErr}=await db.storage.from('event-attachments').upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});
    if(upErr){alert('첨부파일 업로드 실패: '+upErr.message+'\nSupabase Storage 버킷과 정책을 확인해 주세요.');return;}
    attachmentPath=path;attachmentName=file.name;attachmentType=file.type||'application/octet-stream';
  }
  payload.attachment_path=attachmentPath;payload.attachment_name=attachmentName;payload.attachment_type=attachmentType;
  let result;
  if(editingEventId) result=await db.from('class_events').update(payload).eq('id',editingEventId).eq('class_key',classKey);
  else result=await db.from('class_events').insert(payload);
  if(result.error){
    if(file&&attachmentPath) await db.storage.from('event-attachments').remove([attachmentPath]);
    alert('저장에 실패했습니다: '+result.error.message);return;
  }
  if(oldEvent?.attachment_path && (file||$('#removeAttachment').checked)) await db.storage.from('event-attachments').remove([oldEvent.attachment_path]);
  editingEventId=null;$('#btnAddSave').textContent='등록';$('#modalAdd').classList.remove('active');
  $('#addAttachment').value='';$('#removeAttachment').checked=false;
  await refreshEvents();
};

function openDetailModal(ev){
  selectedEventId = ev.id;
  $('#detailTitle').textContent = '['+typeLabel(ev.type)+'] '+ev.title;
  $('#detailMeta').innerHTML = `날짜: <strong>${esc(ev.date)}</strong> | 작성자: ${esc(ev.author||'익명')} (${esc(ev.cls||'공통')}) ${ev.subject?`| 과목: ${esc(ev.subject_group||'')} — ${esc(ev.subject)}`:''}`;
  $('#detailDesc').textContent = ev.desc || '상세 내용이 없습니다.';
  $('#detailAttachment').innerHTML='';
  if(ev.attachment_path){
    const link=document.createElement('a');link.href='#';link.className='event-attachment';link.textContent='첨부파일 열기: '+(ev.attachment_name||'안내문');
    link.onclick=async(e)=>{e.preventDefault();const {data,error}=await db.storage.from('event-attachments').createSignedUrl(ev.attachment_path,300);if(error){alert('첨부파일을 열 수 없습니다: '+error.message);return;}window.open(data.signedUrl,'_blank','noopener');};
    $('#detailAttachment').appendChild(link);
  }
  $('#btnEditEvent').hidden=!canManageEvent(ev);
  $('#btnDeleteEvent').hidden=!canManageEvent(ev);
  $('#modalDetail').classList.add('active');
}

$('#btnDetailClose').onclick=()=> $('#modalDetail').classList.remove('active');

$('#btnDeleteEvent').onclick=async()=>{
  const deleting=eventsCache.find(e=>String(e.id)===String(selectedEventId));
  if(!canManageEvent(deleting)){ alert('일정을 찾을 수 없습니다. 새로고침 후 다시 시도해 주세요.'); return; }
  if(!confirm('정말 이 일정을 삭제하시겠습니까?')) return;
  const {error}=await db.from('class_events').delete().eq('id',selectedEventId).eq('class_key',classKey);
  if(error){ alert('삭제에 실패했습니다: '+error.message); return; }
  if(deleting?.attachment_path) await db.storage.from('event-attachments').remove([deleting.attachment_path]);
  $('#modalDetail').classList.remove('active');
  await refreshEvents();
};
$('#btnEditEvent').onclick=()=>{
  const ev=eventsCache.find(e=>String(e.id)===String(selectedEventId));
  if(!ev || !canManageEvent(ev)) return;
  editingEventId=ev.id;
  buildEventSubjectOptions(ev.subject_group||'',ev.subject||'');
  $('#addAttachment').value='';$('#removeAttachment').checked=false;$('#addModalTitle').textContent='일정 수정';
  $('#addType').value=ev.type; $('#addDate').value=ev.date; $('#addTitle').value=ev.title;
  $('#addDesc').value=ev.desc||'';
  $('#btnAddSave').textContent='수정 저장';
  $('#modalDetail').classList.remove('active'); $('#modalAdd').classList.add('active');
};

$('#btnLogout').onclick=()=>{
  if(confirm('다른 코드로 변경하시겠습니까?')){
    $('#secMain').hidden=true;
    $('#secLogin').hidden=false;
    $('#userProfileForm').hidden=true;
  }
};

$('#btnMyProfile').onclick=openProfile;
$('#btnProfileClose').onclick=()=>$('#modalProfile').classList.remove('active');
$('#btnProfileSave').onclick=()=>{
  const name=$('#profileName').value.trim();if(!name){alert('이름을 입력해 주세요.');return;}
  const electives={};document.querySelectorAll('#profileElectives .profile-elective').forEach(sel=>electives[sel.dataset.group]=sel.value);
  userProfile={name,cls:$('#profileClass').value,electives};
  try{localStorage.setItem(getStorageKey('profile'),JSON.stringify(userProfile));}catch(e){}
  const prefix=(classData.grade?classData.grade+' ':'')+(classData.semester?classData.semester+' ':'');
  $('#displayUserInfo').innerHTML=`${esc(prefix)} <strong>${esc(userProfile.cls)}</strong> - ${esc(userProfile.name)} 학생`;
  $('#modalProfile').classList.remove('active');checkUpcomingEvaluations();alert('내 정보가 저장되었습니다.');
};
$('#btnNotify').onclick=enableNotifications;


(async function autoLogin(){
  if(!supabaseReady) console.warn('Supabase URL/anon key 설정이 필요합니다.');
  const savedCode = localStorage.getItem('eval-board-code') || '';
  if(savedCode){
    try{
      classData = await decodeCode(savedCode);
      rawCode = savedCode;
      classKey=await makeClassKey(savedCode);
      await ensureClassMembership();
      const savedProf = JSON.parse(localStorage.getItem(getStorageKey('profile')));
      if(savedProf){
        userProfile = savedProf;
        initMainView();
      }
    }catch(e){}
  }
})();

setInterval(()=>{if(userProfile)checkUpcomingEvaluations();},30*60*1000);
</script>
